<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#0284C7;#38BDF8" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#38BDF8;#0284C7" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>
    
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- Floating Bubbles -->
  <circle cx="200" cy="100" r="4" fill="#38BDF8" opacity="0.4">
    <animate attributeName="cy" values="100;80;100" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="150" r="6" fill="#0EA5E9" opacity="0.3">
    <animate attributeName="cy" values="150;130;150" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="80" r="3" fill="#38BDF8" opacity="0.5">
    <animate attributeName="cy" values="80;60;80" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="300" cy="200" r="5" fill="#0284C7" opacity="0.4">
    <animate attributeName="cy" values="200;180;200" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Text -->
  <text x="50%" y="42%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#textGradient)" letter-spacing="2">
    JDSG COLLEGE
  </text>
  <text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#94A3B8" font-weight="400" letter-spacing="6">
    LEARN • GROW • ACHIEVE
  </text>

  <!-- Waves -->
  <path fill="url(#wave1)" d="M0,250 C300,350 600,200 1200,300 L1200,400 L0,400 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,250 C300,350 600,200 1200,300 L1200,400 L0,400 Z;
              M0,300 C400,200 800,350 1200,250 L1200,400 L0,400 Z;
              M0,250 C300,350 600,200 1200,300 L1200,400 L0,400 Z" />
  </path>
  <path fill="url(#wave2)" d="M0,320 C400,250 800,380 1200,320 L1200,400 L0,400 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,320 C400,250 800,380 1200,320 L1200,400 L0,400 Z;
              M0,280 C300,380 700,250 1200,350 L1200,400 L0,400 Z;
              M0,320 C400,250 800,380 1200,320 L1200,400 L0,400 Z" />
  </path>
</svg>
