<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A;#0369A1;#0F172A" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#38BDF8;#0284C7" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#0F172A;#38BDF8" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#020617" rx="15" />

  <!-- Waves -->
  <path fill="url(#waveGradient1)" d="M0,200 C150,250 350,150 800,250 L800,300 L0,300 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,200 C150,250 350,150 800,250 L800,300 L0,300 Z;
              M0,220 C200,150 400,280 800,220 L800,300 L0,300 Z;
              M0,200 C150,250 350,150 800,250 L800,300 L0,300 Z" />
  </path>
  <path fill="url(#waveGradient2)" d="M0,240 C200,200 400,280 800,230 L800,300 L0,300 Z">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0,240 C200,200 400,280 800,230 L800,300 L0,300 Z;
              M0,230 C250,270 450,180 800,260 L800,300 L0,300 Z;
              M0,240 C200,200 400,280 800,230 L800,300 L0,300 Z" />
  </path>

  <!-- Text -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="'Fira Code', monospace" font-size="42" font-weight="bold" fill="url(#waterGradient)">
    JDSG College
  </text>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" fill="#94A3B8" letter-spacing="4">
    LEARN • GROW • ACHIEVE
  </text>
</svg>
