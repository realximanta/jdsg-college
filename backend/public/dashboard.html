<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - JDSG College</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        institutional: '#1E3A8A',
                        tealaccent: '#0284C7',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-serif font-bold text-institutional cursor-pointer" onclick="window.location.reload()">JDSG College</h1>
            <button onclick="logout()" class="text-sm font-medium text-red-600 hover:text-red-800 transition border border-red-200 px-4 py-2 rounded-lg hover:bg-red-50">
                Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Profile Sidebar -->
        <div class="md:col-span-1" data-aos="fade-right">
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center sticky top-24">
                <!-- Profile Image -->
                <div class="relative inline-block">
                    <img id="profile-img" src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" alt="Profile" class="w-32 h-32 rounded-full object-cover border-4 border-slate-100 shadow-sm mx-auto">
                </div>
                
                <!-- User Info -->
                <h2 id="profile-name" class="text-2xl font-bold text-slate-800 mt-4 mb-1">Loading...</h2>
                <span id="profile-role" class="inline-block bg-tealaccent/10 text-tealaccent text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide mb-6">
                    Student
                </span>

                <div class="space-y-3 text-left">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <span class="text-slate-500 text-sm">Phone</span>
                        <span id="profile-phone" class="font-medium text-slate-800 text-sm">-</span>
                    </div>
                    <div id="detail-row-1" class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <span id="detail-label-1" class="text-slate-500 text-sm">Class</span>
                        <span id="detail-val-1" class="font-medium text-slate-800 text-sm">-</span>
                    </div>
                    <div id="detail-row-2" class="flex justify-between items-center pb-2">
                        <span id="detail-label-2" class="text-slate-500 text-sm">Semester</span>
                        <span id="detail-val-2" class="font-medium text-slate-800 text-sm">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notifications Feed -->
        <div class="md:col-span-2" data-aos="fade-left">
            <h2 class="text-3xl font-serif font-bold text-institutional mb-6">Campus Notifications</h2>
            
            <!-- Loading State -->
            <div id="notif-loading" class="flex justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-institutional"></div>
            </div>

            <!-- Error State -->
            <div id="notif-error" class="hidden bg-red-50 text-red-600 p-4 rounded-lg text-center">
                Failed to load notifications. Backend might be waking up.
                <button onclick="fetchNotifications()" class="underline ml-2 font-semibold">Retry</button>
            </div>

            <!-- Notification List -->
            <div id="notif-list" class="space-y-4 hidden">
                <!-- Cards injected via JS -->
            </div>
        </div>

    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
