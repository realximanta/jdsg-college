name: Build and Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag format and extract version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG"       >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read current version from build.gradle.kts
        id: current
        run: |
          GRADLE="app/app/build.gradle.kts"
          [ -f "$GRADLE" ] || { echo "::error::$GRADLE missing"; exit 1; }
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$GRADLE" | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE" | head -1)
          [ -n "$CODE" ] || { echo "::error::versionCode not found"; exit 1; }
          [ -n "$NAME" ] || { echo "::error::versionName not found"; exit 1; }
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          if [ "$NAME" = "${{ steps.ver.outputs.version }}" ]; then
            echo "skip=true"  >> $GITHUB_OUTPUT
            echo "versionName already at $NAME — idempotent re-run, skipping bump"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and commit
        if: steps.current.outputs.skip == 'false'
        id: bump
        run: |
          GRADLE="app/app/build.gradle.kts"
          NEW_CODE=$(( ${{ steps.current.outputs.code }} + 1 ))
          sed -i "s/versionCode = ${{ steps.current.outputs.code }}/versionCode = $NEW_CODE/" "$GRADLE"
          sed -i 's/versionName = "${{ steps.current.outputs.name }}"/versionName = "${{ steps.ver.outputs.version }}"/' "$GRADLE"
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$GRADLE"
          git commit -m "chore(release): bump to v${{ steps.ver.outputs.version }} (build $NEW_CODE)"
          git push origin HEAD:main

      - name: Resolve final versionCode
        id: final
        run: |
          if [ -n "${{ steps.bump.outputs.new_code }}" ]; then
            echo "code=${{ steps.bump.outputs.new_code }}" >> $GITHUB_OUTPUT
          else
            echo "code=${{ steps.current.outputs.code }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: |
          cd app
          gradle wrapper --gradle-version 8.7

      - name: Restore Keystore & local.properties
        run: |
          # 1. Restore Keystore
          mkdir -p "$HOME/.android"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/release.keystore"
          chmod 600 "$HOME/.android/release.keystore"
          test -s "$HOME/.android/release.keystore" || { echo "::error::keystore decoded to empty file"; exit 1; }
          
          # 2. Create local.properties for the build
          echo "WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}" > app/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> app/local.properties

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: $HOME/.android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd app
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Locate and rename APK
        id: apk
        run: |
          SRC=$(find app/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          [ -n "$SRC" ] || { echo "::error::no APK produced"; exit 1; }
          DEST="jdsg-college-${{ steps.ver.outputs.tag }}.apk"
          cp "$SRC" "$DEST"
          SIZE=$(stat -c%s "$DEST")
          echo "path=$DEST"   >> $GITHUB_OUTPUT
          echo "size=$SIZE"   >> $GITHUB_OUTPUT

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          tag_name: ${{ steps.ver.outputs.tag }}
          fail_on_unmatched_files: true
          overwrite_files: true
